name: Linux release path

on:
  push:
    branches: [main, "epic/**", "bugs/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Smoke the isolated demo
        run: |
          cargo run --manifest-path rust/Cargo.toml --quiet -- demo --ascii --width 100 > demo-output.txt
          grep -q "Demo complete" demo-output.txt
          grep -q "MULTIVERSE NETWORK" demo-output.txt
          test ! -e "$HOME/.tang/catalog.db"
          test ! -e "$GITHUB_WORKSPACE/.tang/tang.db"
