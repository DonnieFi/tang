[package]
name = "tang"
version = "2.0.0"
edition = "2021"
description = "Tang 2.0 global catalog and recall"
license = "MIT"
publish = false

[[bin]]
name = "tang"
path = "src/main.rs"

[dependencies]
regex = "1.11"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
